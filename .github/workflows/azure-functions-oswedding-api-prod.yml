name: Deploy Azure Function App (oswedding-api-prod)

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/azure-functions-oswedding-api-prod.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Create deploy zip
        run: |
          cd api
          zip -r ../functionapp.zip . -x "local.settings.json" -x ".gitignore"
          cd ..
          echo "Zip contents:"
          unzip -l functionapp.zip

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: oswedding-api-prod
          package: ./functionapp.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
