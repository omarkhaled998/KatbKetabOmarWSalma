name: Deploy Azure Function App (oswedding-api-prod)

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/azure-functions-oswedding-api-prod.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies (api)
        run: npm ci
        working-directory: api

      - name: Verify function files
        run: |
          ls -la api
          ls -la api/GetWishes
          ls -la api/SaveWish
          test -f api/GetWishes/index.js
          test -f api/GetWishes/function.json
          test -f api/SaveWish/index.js
          test -f api/SaveWish/function.json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App from api folder
        uses: Azure/functions-action@v1
        with:
          app-name: oswedding-api-prod
          package: ./api
